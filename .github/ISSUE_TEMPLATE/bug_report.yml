name: Bug report
description: Report an incorrect finding or broken behavior.
body:
  - type: textarea
    id: example
    attributes:
      label: Minimal HTML or reproduction
      description: Use public or anonymized data. Never include secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and actual result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SiteAudit Kit version and Python version
    validations:
      required: true
